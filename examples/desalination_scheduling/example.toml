# Site and sweep metadata for desalination_scheduling.
# `tools/site/build.py` reads this to build the landing page and to validate the
# example; `tools/sweep.py` reads the [sweep] block. See CONTRIBUTING.md.

schema_version = 1
name = "desalination_scheduling"
title = "Desalination scheduling"
order = 20

blurb = """
A seawater desalination plant has to hit a monthly water target. See how the size of that \
target changes when the plant runs and what each acre-foot costs."""

tags = ["MILP", "unit commitment", "1 month @ 15 min", "HiGHS", "~27k binaries"]

[notebooks]
solver = "notebook.py"
sweep = "sweep.py"
wasm = "explore.py"

[wasm]
mode = "run"
show_code = false
execute = true

[solve]
solver = "highs"
runtime_minutes = 15
# The month is a MILP: per-step RO recovery enters as the linear window
# `recovery_min * feed <= permeate <= recovery_max * feed` (the recovery_window
# extension), so HiGHS solves it through relax-and-fix in about a minute and a
# half a point. CI still solves only a short horizon -- a month is too slow for
# every pull request -- see tests/test_desalination_smoke.py.
ci_runnable = false

[sweep]
axis = "demand_af"
axis_label = "Monthly obligation (acre-feet of product water)"
columns = [
    "trains_online",
    "trains_recuperating",
    "post_treatment_status",
    "ro0_status",
    "ro1_status",
    "ro2_status",
    "product_m3_per_hr",
    "onspec_permeate_m3_per_hr",
    "offspec_permeate_m3_per_hr",
    "ro_kw",
    "grid_kw",
    "energy_price",
]

# A month at 15-minute resolution is 2,976 rows and unreadable as a line chart,
# so the page draws two reductions of it rather than the whole thing.
[[sweep.views]]
name = "series"
kind = "window"
days = 3

[[sweep.views]]
name = "profile"
kind = "diurnal"
