# Site and sweep metadata for sb_retrofit_demo.
# `tools/site/build.py` reads this to build the landing page and to validate the
# example; `tools/sweep.py` reads the [sweep] block. See CONTRIBUTING.md.

schema_version = 1
name = "sb_retrofit_demo"
title = "Santa Barbara retrofit: before and after"
order = 30

blurb = """
The same desalination plant delivers the same month of water, before and after a retrofit \
of extra membranes and a small battery, so watch it shed its peak load."""

tags = ["MILP", "retrofit", "1 month @ 15 min", "HiGHS"]

[notebooks]
solver = "notebook.py"
sweep = "sweep.py"
wasm = "explore.py"

[wasm]
mode = "run"
show_code = false
execute = true

[solve]
solver = "highs"
runtime_minutes = 20
# A full month of case B is a relax-and-fix MILP that takes minutes. CI solves
# a three-day horizon instead: tests/test_sb_retrofit_demo.py.
ci_runnable = true

[sweep]
# Two points, not a range: the "sweep" is the two cases.
axis = "case_index"
axis_label = "Case (0 = before retrofit, 1 = after retrofit)"
columns = [
    "trains_online",
    "product_m3_per_hr",
    "offspec_permeate_m3_per_hr",
    "plant_kw",
    "grid_kw",
    "battery_charge_kw",
    "battery_discharge_kw",
    "battery_soc",
    "in_peak",
]

[[sweep.views]]
name = "series"
kind = "full"
