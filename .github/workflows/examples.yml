# Do the examples still solve?
#
# pyproject.toml installs flex-pse from `git+...@main`, which pins nothing, so
# these examples can break without a commit landing in this repository. That is
# what the weekly run is for. The site build (pages.yml) deliberately does not
# depend on any of this -- every published result is committed, so the site keeps
# working even while an example is broken, and this workflow is what tells you.

name: examples

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - ".github/workflows/examples.yml"
  pull_request:
    paths:
      - "examples/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - ".github/workflows/examples.yml"
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The fast gate: the data contract and the WebAssembly import allowlist. No
  # conda, no solver, ~30 seconds -- and it catches most of what goes wrong when
  # someone adds an example.
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # No flexops here, and none needed: these tests read committed CSVs and
      # parse notebooks. The one test that does need it skips itself. The
      # `--with` list here is a fast, isolated stand-in for the project's
      # actual dependencies -- cross-check against pyproject.toml's
      # `[dependency-groups]`/`[project.dependencies]` if it ever drifts.
      - name: Data contract and WASM safety
        run: |
          uv run --no-project --python 3.13 \
            --with pytest --with 'pandas>=2' --with 'duckdb>=1.1' \
            pytest -q tests/test_sweep_data.py tests/test_wasm_notebooks.py

  # The slow gate: real models, real solves, against whatever flexPSE main is
  # today.
  solve:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # `flex-pse` is a core dependency, installed from an unpinned git
      # branch, and there's no committed uv.lock -- so this always resolves
      # against whatever `main` is today rather than reusing a stale
      # resolution. `uv sync` installs the project itself plus the `dev`
      # group (pytest, jinja2, ruff); `highspy` comes along transitively via
      # `flex-pse[solvers]`.
      - name: Install the project
        run: uv sync --group dev

      # Purely diagnostic: when this job goes red the first question is always
      # "against which flexPSE?", and the answer belongs in the log rather than
      # in a bisect. It must never be the thing that turns the job red -- a
      # missing flex-pse is caught loudly by Solve below. Mirrors the defensive
      # lookup in tools/sweep.py::_flexpse_provenance().
      - name: Record the resolved flexPSE commit
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.metadata as md, json

          try:
              dist = md.distribution("flex-pse")
          except md.PackageNotFoundError:
              print("flex-pse not installed")
          else:
              print("flex-pse", dist.version)
              try:
                  raw = dist.read_text("direct_url.json")
                  if raw:
                      info = json.loads(raw)
                      print("url   ", info.get("url"))
                      print("commit", info.get("vcs_info", {}).get("commit_id", "?"))
              except (OSError, json.JSONDecodeError):
                  print("commit unresolved")
          PY

      # The import is a real precondition -- without a solver the solves below
      # are theatre, so it fails hard. The version is decoration and must not:
      # `highspy.__version__` disappeared upstream and took this job, and via
      # `needs: solve` the drift job with it, down for a week while the real
      # test suite never ran once.
      - name: Solvers available
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.metadata as md
          import highspy  # noqa: F401 -- the assertion is that this imports

          try:
              version = md.version("highspy")
          except md.PackageNotFoundError:
              version = "unknown"
          print("highspy", version)
          PY

      - name: Solve
        run: uv run --no-sync pytest -q tests/

  # Has the committed data drifted from what the model produces today? Weekly
  # only, and it opens an issue rather than failing red forever -- drift is a
  # thing to look at, not a thing that should block every later PR.
  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: solve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Uncached on purpose: this job runs weekly and its entire question is
      # "what does upstream do today", so it should always resolve fresh.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install the project
        run: uv sync --group dev

      - id: check
        continue-on-error: true
        run: uv run --no-sync python tools/check_drift.py examples/pump_scheduling --rtol 1e-3

      - name: Open an issue on drift
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Committed pump_scheduling sweep no longer reproduces" \
            --body "The weekly rebuild solved \`examples/pump_scheduling\` and got different numbers than the sweep committed under \`public/\`.

          Either flexPSE changed upstream in a way that moves this example's answer, or the committed data is stale. Re-run \`python tools/sweep.py examples/pump_scheduling\` and review the diff before committing it.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
