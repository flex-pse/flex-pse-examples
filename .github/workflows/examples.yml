# Do the examples still solve?
#
# environment.yml installs flex-pse from `git+...@main`, which pins nothing, so
# these examples can break without a commit landing in this repository. That is
# what the weekly run is for. The site build (pages.yml) deliberately does not
# depend on any of this -- every published result is committed, so the site keeps
# working even while an example is broken, and this workflow is what tells you.

name: examples

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "tests/**"
      - "tools/**"
      - "environment.yml"
      - ".github/workflows/examples.yml"
  pull_request:
    paths:
      - "examples/**"
      - "tests/**"
      - "tools/**"
      - "environment.yml"
      - ".github/workflows/examples.yml"
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The fast gate: the data contract and the WebAssembly import allowlist. No
  # conda, no solver, ~30 seconds -- and it catches most of what goes wrong when
  # someone adds an example.
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # No flexops here, and none needed: these tests read committed CSVs and
      # parse notebooks. The one test that does need it skips itself.
      - name: Data contract and WASM safety
        run: |
          uv run --no-project --python 3.13 \
            --with pytest --with 'pandas>=2' --with 'duckdb>=1.1' \
            pytest -q tests/test_sweep_data.py tests/test_wasm_notebooks.py

  # The slow gate: real models, real solves, against whatever flexPSE main is
  # today.
  solve:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        # A login shell is what makes `conda activate` work in later steps.
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: week
        # The cache key has to expire. flex-pse is installed from an unpinned
        # git branch, so a key that only hashes environment.yml would pin the
        # environment forever and this job would test a frozen upstream --
        # which is the one thing it exists not to do.
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # Install conda WITHOUT the environment file, so the cache below gets a
      # chance to restore before anything is solved. Creating the environment
      # here and caching afterwards -- the obvious ordering -- makes the cache
      # pure overhead: it would be written every run and never read.
      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: flex-pse-examples
          miniforge-version: latest
          use-mamba: true

      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CONDA }}/envs
          key: >-
            conda-${{ runner.os }}-${{ hashFiles('environment.yml') }}-${{ steps.week.outputs.week }}

      - name: Create the environment
        if: steps.cache.outputs.cache-hit != 'true'
        run: mamba env update -n flex-pse-examples -f environment.yml

      # Print what upstream actually resolved to. When this job goes red, the
      # first question is always "against which flexPSE?", and the answer should
      # be in the log rather than in a bisect.
      - name: Record the resolved flexPSE commit
        run: |
          python - <<'PY'
          import importlib.metadata as md, json
          dist = md.distribution("flex-pse")
          print("flex-pse", dist.version)
          raw = dist.read_text("direct_url.json")
          if raw:
              info = json.loads(raw)
              print("url   ", info.get("url"))
              print("commit", info.get("vcs_info", {}).get("commit_id", "?"))
          PY

      - name: Solvers available
        run: |
          python -c "import highspy; print('highspy', highspy.__version__)"

      - name: Solve
        run: pytest -q tests/

  # Has the committed data drifted from what the model produces today? Weekly
  # only, and it opens an issue rather than failing red forever -- drift is a
  # thing to look at, not a thing that should block every later PR.
  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: solve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Uncached on purpose: this job runs weekly and its entire question is
      # "what does upstream do today", so it should always resolve fresh.
      - uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          environment-file: environment.yml
          activate-environment: flex-pse-examples
          miniforge-version: latest
          use-mamba: true

      - id: check
        continue-on-error: true
        run: python tools/check_drift.py examples/pump_scheduling --rtol 1e-3

      - name: Open an issue on drift
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Committed pump_scheduling sweep no longer reproduces" \
            --body "The weekly rebuild solved \`examples/pump_scheduling\` and got different numbers than the sweep committed under \`public/\`.

          Either flexPSE changed upstream in a way that moves this example's answer, or the committed data is stale. Re-run \`python tools/sweep.py examples/pump_scheduling\` and review the diff before committing it.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
